openapi: 3.1.0
info:
  title: AI Prompt Studio Open API
  version: 0.1.0
  description: 已发布 Prompt 和工作流的外部调用契约。
servers:
  - url: /openapi/v1
security:
  - ProjectApiKey: []
paths:
  /prompts/{code}/invoke:
    post:
      summary: 调用已发布 Prompt
      operationId: invokePublishedPrompt
      parameters:
        - $ref: '#/components/parameters/ResourceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: 调用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /workflows/{code}/invoke:
    post:
      summary: 调用已发布工作流
      operationId: invokePublishedWorkflow
      parameters:
        - $ref: '#/components/parameters/ResourceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: 调用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    ProjectApiKey:
      type: http
      scheme: bearer
      bearerFormat: aip_
  parameters:
    ResourceCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
  schemas:
    InvokeRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: object
          additionalProperties: true
        stream:
          type: boolean
          default: false
        idempotencyKey:
          type: string
          maxLength: 128
    InvokeResponse:
      type: object
      required: [executionId, status, output]
      properties:
        executionId:
          type: string
        traceId:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, RUNNING]
        output: {}
        usage:
          type: object
          properties:
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
            estimatedCost: { type: number, minimum: 0 }
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
  responses:
    BadRequest:
      description: 请求参数或变量校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 凭证无效、过期或已停用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源未发布或不可访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 超过调用限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
